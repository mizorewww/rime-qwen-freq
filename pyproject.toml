[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rime-qwen-freq"
version = "0.4.0"
description = "Offline CausalLM unigram word-frequency calibration, Bayesian domain log-odds boosting, and PMI N-gram (.gram) distillation for Rime."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "mizorewww" }]
keywords = ["rime", "ime", "pinyin", "word-frequency", "ngram", "octagram", "qwen", "language-model", "distillation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
score = [
    "torch>=2.4.0",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]
cuda-kernels = [
    "kernels>=0.17.2,<0.18.0",
    "fla-core",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rime-qwen-freq = "rime_qwen_freq.cli:main"

[project.urls]
Homepage = "https://github.com/mizorewww/rime-qwen-freq"
Repository = "https://github.com/mizorewww/rime-qwen-freq"
Issues = "https://github.com/mizorewww/rime-qwen-freq/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rime_qwen_freq = ["_bench/*"]
